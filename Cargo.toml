[workspace]
members = [".", "tests/crates/plugin-alpha", "tests/crates/plugin-beta"]
resolver = "2"

[package]
name = "chorda"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Cordis-inspired, async-native plugin kernel: fibers, realms, scoped events, typed pipelines, and a config-driven entry loader."
repository = "https://github.com/mon3stera/chorda"
readme = "README.md"
keywords = ["plugin", "async", "kernel", "fiber", "middleware"]
categories = ["asynchronous", "rust-patterns"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
inventory = "0.3.21"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
slotmap = "1.1.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
plugin-alpha = { path = "tests/crates/plugin-alpha" }
plugin-beta = { path = "tests/crates/plugin-beta" }
