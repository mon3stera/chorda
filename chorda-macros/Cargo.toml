[package]
name = "chorda-macros"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The #[plugin] attribute macro for the chorda kernel: axum-style service extraction."
repository = "https://github.com/mon3strera/chorda"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
